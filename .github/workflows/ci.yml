name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      # Deliberately not pinned to an exact version. Pinning to 26.0 selected an
      # Xcode whose SDK was iphonesimulator26.0 while the image carried only iOS
      # 26.2+ simulator runtimes, so no iOS destination could resolve. The Swift
      # floor is already enforced by `// swift-tools-version: 6.2` in
      # Package.swift, which fails the build outright on an older toolchain.
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Report toolchain
        run: swift --version && xcodebuild -version
      - name: Format check
        run: |
          brew install swiftformat
          swiftformat --lint .
      - name: Swift tests
        run: swift test
      - name: Generate Xcode project
        run: gem install xcodeproj --no-document && ruby scripts/generate_xcodeproj.rb
      # The generator owns the entitlements, so a drifted App Group ID shows up
      # here instead of as a nil container at runtime. The .xcodeproj itself is
      # excluded: its object identifiers are not stable enough to diff.
      - name: Verify generated entitlements are committed
        run: git diff --exit-code -- '*.entitlements'
      # macos-26 images vary: some arrive without an iOS simulator runtime, and
      # the generic iOS Simulator destination then resolves to nothing. A no-op
      # on a healthy image; a multi-gigabyte download on a bare one.
      - name: Ensure an iOS simulator runtime is installed
        run: |
          if xcrun simctl list runtimes | grep -q "iOS "; then
            echo "iOS simulator runtime already present."
          else
            echo "No iOS simulator runtime on this image; downloading the platform."
            xcodebuild -downloadPlatform iOS
          fi
          xcrun simctl list runtimes
      - name: Build iOS shell
        run: xcodebuild -project CreatorStudio.xcodeproj -scheme CreatorStudio -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build

  gateway:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ai-gateway
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: services/ai-gateway/package-lock.json
      - run: npm ci
      - run: npm run check
